    --panel-body:     #3a3a36;

    --close-bg:       rgba(0,0,0,0.06);
    --close-hover:    rgba(0,0,0,0.13);
    --overlay-bg:     rgba(0,0,0,0.28);

    :root {
      --bg:   #0f0f0d;
      --surf: #1a1a17;
      --ink:  #e8e6de;
      --mut:  #9a9890;

  text.ts     { font-size: 11px; font-weight: 400; fill: var(--mut); }
  text.tlabel { font-size: 10px; font-weight: 400; fill: var(--col-label); }
  text.tinsight { font-size: 10px; font-weight: 500; font-style: italic; fill: var(--col-label); }

  path.back      { fill: none; stroke: var(--back-dash); stroke-width: 1; stroke-dasharray: 5 4; }
  rect.pdash     { fill: none; stroke: var(--panel-dash); stroke-width: 0.5; stroke-dasharray: 4 3; }
  rect.insight-band { fill: none; stroke: var(--panel-dash); stroke-width: 0.5; stroke-dasharray: 3 3; rx: 6; }

  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--overlay-bg);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;

  #overlay.open { display: flex; }

  #panel {
    background: var(--panel-bg);
    border: 0.5px solid var(--panel-brd);
    border-radius: 14px;
    padding: 1.75rem 2rem 2rem;
    max-width: 520px;
    width: 100%;
    max-height: 82vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 28px 72px rgba(0,0,0,0.18);

    height: 3px;
    border-radius: 2px;
    margin-bottom: 1rem;
  }
  #panel .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 0.9rem;
  }
  #panel .tag {
    font-size: 0.67rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 20px;
    background: var(--panel-tag-bg);
    color: var(--panel-tag-ink);

    font-size: 1rem;
    font-weight: 500;
    color: var(--panel-head);
    margin-bottom: 0.3rem;
    line-height: 1.35;

  #panel .sub {
    font-size: 0.74rem;
    color: var(--mut);
    margin-bottom: 1rem;
    letter-spacing: 0.02em;

  #panel p {
    font-size: 0.83rem;
    line-height: 1.78;
    color: var(--panel-body);
    margin-bottom: 0.8rem;
  }
  #panel p:last-of-type { margin-bottom: 0; }
  #panel .ex {
    margin-top: 1rem;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    background: var(--panel-tag-bg);
    border-left: 3px solid transparent;
  }
  #panel .ex-label {
    font-size: 0.67rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--mut);
    margin-bottom: 0.4rem;
  }
  #panel .ex p { font-size: 0.79rem; margin-bottom: 0; }

  #close {
    position: absolute;
    top: 1rem; right: 1rem;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: var(--close-bg);
    color: var(--mut);
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.13s;
    line-height: 1;
  }
  #close:hover { background: var(--close-hover); }

  footer {
    margin-top: 2rem;
    font-size: 0.7rem;
    color: var(--mut);
    letter-spacing: 0.06em;
  }
</style>
</head>

<script>
const N = {
  individual:{
    color:'#185FA5',tags:['scale 1','clinical twin','ground truth'],
    title:'Individual — the starting point',
    sub:'Biology as ground truth. The tightest feedback loop.',
    body:`This is scale 1 — the single patient, the single construction site, the single household. It is where you anchor the system first because feedback is fast, loss is measurable, and the stakes are unambiguous.\n\nThe clinical digital twin starts here. You ingest vitals, labs, symptoms, and social context as a raw tensor. Everything upstream — kin network, hospital system, national policy — exists to serve this layer. If you get the individual representation wrong, every higher scale inherits the error.\n\nKey rule: start here, not at the civilizational layer. The gradient ∇L is sharpest here. Prove the loop at scale 1 before generalising upward. The proof-of-gradient test is one case, end-to-end: show the recommended action, the blocker, the intervention that clears the blocker, and the outcome shift.`,
    ex:'A sepsis patient in Mulago: HR 118, temp 38.9°C, lactate 3.2. That is the individual tensor. Everything else — who can consent, who will pay, whether a bed exists — is the system acting on this raw state.'
  },
  tensor:{
    color:'#185FA5',tags:['math layer','T','N-dimensional','input','Operational'],
    title:'T — Tensor: raw reality  ·  Operational timescale',
    sub:'The uncompressed state of the environment. Always-on. No urgency yet — no decision has been made.',
    body:`A tensor is an N-order array capturing multiple modalities simultaneously: spatial coordinates, temporal fluxes, thermal gradients, kinetic shifts. In the clinical twin these are vitals, labs, imaging, and social context. In the Strata Stone real estate twin these are 120 variables across 9 departments and 20 sites.\n\nThe Tensor layer sits at the Operational timescale because it requires continuous, uninterrupted instrumentation of reality. There is no urgency at this layer — urgency emerges downstream as the data is compressed. You cannot shortcut to a Scalar without first having a clean Tensor.\n\nThe inversion principle: the Tensor is the most patient layer. The Scalar is the most urgent. Compression IS the urgency. Each layer strips dimensions until you arrive at a number that demands immediate action precisely because nothing further can be stripped from it.\n\nFailure mode at this layer: missing sensors. If the right variables are not being ingested, every downstream inference will be systematically blind to the most important signals.`,
    ex:'The 120-variable tensor in ukb-dt-ssp-v07 spans Finance, Procurement, Material Control, Project Management, Legal, Customer Relations, and three other departments — instrumentation of reality. Operational means it never stops running.'
  },
  operational:{
    color:'#185FA5',tags:['triage clock','Tensor','continuous','always-on','T layer'],
    title:'Operational — the always-on baseline',
    sub:'All variables monitored simultaneously, continuously. No crisis — no urgency. This is the ground state.',
    body:`The Operational timescale is paired with the Tensor layer for a precise reason: both are maximally uncompressed. The Tensor holds N-dimensional raw reality; Operational monitoring means you are reading all of it, all the time, without selecting a subset to focus on.\n\nThere is no urgency at the Operational/Tensor level because no compression has occurred yet — and urgency is a product of compression. When the system is in steady Operational state, it is simply absorbing reality and maintaining the data feed.\n\nThe cost of Operational monitoring is high. This is why the triage engine must classify which variables require continuous tracking and which can be downgraded to Ritual (weekly) or Strategic (quarterly). Variables with high eigenmode weight and high volatility stay on Operational; the rest get downgraded.\n\nCrucial asymmetry: putting too much on Operational is wasteful. Putting too little means fast-moving crises are invisible until they breach a threshold — at which point the window for early intervention has closed.`,
    ex:'An ICU patient on a ventilator: SpO2, HR, BP, and end-tidal CO2 are Operational (30-second sampling). They stay at the Tensor layer — uncompressed, continuous — because their rate of change demands it.'
  },
  er:{
    color:'#534AB7',tags:['triage clock','Eigenmode','Existential','t < 1h','crisis IS the eigenmode'],
    title:'Existential / ER — the Eigenmode timescale  ⚡',
    sub:'By the time you have extracted the dominant invariant, you have maybe an hour. The eigenmode IS the emergency.',
    body:`This is the architectural insight that the v10 alignment makes explicit: the Existential/ER timescale is not paired with a triage step — it is paired with the Eigenmode, the E layer of the T→M→V→E→S sequence.\n\nWhy? Because eigenmode extraction is the moment of maximum compression. You have taken an N-dimensional tensor, compressed it through a weight matrix, stored it as a latent vector, and then extracted the single dominant invariant — the one structural fact that explains the crisis. At that moment, you have under an hour to act.\n\nThe eigenmode extraction IS the triage assessment. "This is septic shock" is not a diagnosis — it is an eigenmode. Once λ₁ dominates, everything else becomes secondary. The pipeline from Tensor to Eigenmode takes time. But from Eigenmode to Scalar must be near-instant.\n\nTimescale lock-in failure: if the system responds to an Existential crisis with Strategic latency (scheduling a test for next month), the patient dies. The digital twin's job is to detect this mismatch and escalate immediately.`,
    ex:'Sepsis: the 1-hour bundle (antibiotics, fluids, blood cultures, lactate) exists because the eigenmode demands action before full confirmation. "Septic shock" is the eigenmode. The bundle is the scalar that follows automatically — no further deliberation required.'
  },
  lgkx:{
    color:'#5F5E5A',tags:['constraint','L','G','K','X','deployment'],
    title:'Constraint check — L · G · K · X',
    sub:'The four forces that prevent a correct decision from being deployed.',
    body:`Every recommended action passes through a constraint check before it can become a real-world scalar. The four types:\n\nL = Labor: is the required human available? (surgeon, driver, engineer)\nG = Governance: is authority and consent in place? (husband not present, ministry approval pending)\nK = Capital: is the money accessible? (payment not secured, credit maxed)\nX = Logistics: can things physically move? (no transport, supply delay, last-mile failure)\n\nThis is the layer most AI health and planning systems skip. They output a recommendation and stop. The Ukubona system must output: recommendation + feasibility score + specific blocker + intervention that clears the blocker.\n\nThe constraint check runs at every scale. Scale 1: can this patient get surgery today? Scale 4: can this budget be released this quarter? Same architecture, different tensor inputs.`,
    ex:'Obstructed labour in rural Uganda: clinical eigenmode says C-section. L is available (surgeon on call). K is available (NHIS covers it). But G fails — husband is the legal decision-maker under local custom and is unreachable. The blocker is Governance, not Medicine.'
  },
  kin:{
    color:'#0F6E56',tags:['scale 2','mesoscale','social graph','the missing layer'],
    title:'Kin network — the layer that was missing',
    sub:'Deployment is a social computation, not an individual one.',
    body:`This was the critical correction in the architecture. The original scaling path (Individual → Hospital → National → Civilizational) was a tetrad — it violated the pentadic invariant. The kin network is the missing scale 2.\n\nThe kin network is the distributed latent space across multiple agents: family, caregivers, social graph, financial support structure, cultural priors. Mathematically: v_kin = Σ wᵢ · vᵢ, where each vᵢ is an individual state vector and wᵢ is a relational weight (trust, proximity, obligation).\n\nWhy it is non-optional: individuals do not deploy scalar actions alone. Decisions are co-regulated. Cost (C) is shared across the kin network. Velocity (V) is constrained or amplified by the social structure. A medically optimal action with a failing kin network will not execute.\n\nThe kin layer modifies all three variables of η: M (support increases magnitude of outcome), V (transport and coordination set the velocity), C (who pays and how burden is distributed).`,
    ex:'Patient needs urgent surgery. No transport. No money. Husband not present. The scalar action fails at deployment — not because the hospital failed, but because the kin network has zero logistical and governance capacity at this moment.'
  },
  matrix:{
    color:'#0F6E56',tags:['math layer','M','compression','emotion','weights W','Strategic'],
    title:'M — Matrix: the compression operator  ·  Strategic timescale',
    sub:'Calibrating the weights W globally. Slow, deliberate, expensive. You are restructuring the compressor itself.',
    body:`The Matrix layer is paired with the Strategic timescale because changing the global weight matrix W — recalibrating how the system compresses reality — is a months-to-years commitment. You are not reacting to a crisis; you are restructuring the architecture that will handle future crises.\n\nIn neural networks, W is the encoder weight matrix. In human cognition, emotion performs this role — assigning heavy weights to immediate threats or high-reward stimuli, zeroing out irrelevant noise. In clinical practice: redesigning triage scoring systems, retraining clinical staff, changing what gets measured and how.\n\nThe Strategic/Matrix pairing means: when the matrix is wrong (biased toward visible symptoms, ignoring social determinants), you cannot fix it in real time. It requires a systematic intervention at the training/architecture level — a strategic-timescale investment.\n\nFailure mode: trying to fix a Matrix problem (wrong weights W) at the Tactical timescale. You cannot retrain a clinician's gestalt during a crisis. The fix has to have happened months before.`,
    ex:'Strata Stone policy requiring all payments through bank/mobile money is a Strategic/Matrix intervention. It recalibrates the Governance weight G globally across all sites — restructuring the compressor before the leakage crisis occurs, not after.'
  },
  tactical:{
    color:'#993C1D',tags:['triage clock','Scalar','t → 0','first aid','pipeline already ran'],
    title:'Tactical / First Aid — the Scalar timescale  ·  t → 0',
    sub:'No deliberation. The entire pipeline has already run. This is just: deploy.',
    body:`The Tactical timescale is paired with the Scalar for the deepest reason in the architecture: by the time you are at t→0, all compression is complete. You have a single number. The only remaining question is whether to act on it.\n\nThe inversion principle made concrete: the Tensor (Operational) required patience and breadth. The Scalar (Tactical) requires speed and singularity. Each layer between them stripped dimensions and increased urgency. The Scalar is the most urgent precisely because nothing further can be removed from it.\n\nAt t→0, the system cannot afford latent-space traversal. Hard-coded clinical algorithms live here: ACLS, ATLS, haemorrhage control. They exist because the cost of deliberation at t→0 exceeds the cost of a false positive.\n\nCritical rule: you cannot shortcut to the Scalar without running the full pipeline (T→M→V→E→S). First-aid that bypasses eigenmode extraction is pattern-matching without understanding. Sometimes it saves lives. Often it deploys the right action on the wrong crisis — same scalar, wrong eigenmode.`,
    ex:'Bystander CPR. The person is not running a differential diagnosis. They have completed the pipeline (unconscious + no pulse = cardiac arrest eigenmode) and deployed the only available scalar: compression at 100–120/min. The Tactical moment arrives after the Existential recognition — never before.'
  },
  feasibility:{
    color:'#0F6E56',tags:['kin layer','deployment','social feasibility','blockers'],
    title:'Feasibility filter — who decides, who pays',
    sub:'The gap between medically optimal and socially executable.',
    body:`This is the output of the kin-network layer applied to the recommended action. It answers four questions:\n\n1. Who is available? (physical presence)\n2. Who decides? (authority, consent, cultural role)\n3. Who pays? (financial capacity, insurance, credit)\n4. Who moves the patient? (transport, logistics)\n\nThe feasibility filter produces a score between 0 and 1. A score below threshold means the recommended action, however medically correct, cannot be deployed in the current social configuration.\n\nThe output is then an alternative scalar: not "do surgery" but "call the husband, obtain consent, trigger the NHIS payment, arrange ambulance — then do surgery." The intervention is at the kin layer, not the clinical layer.\n\nThis is the upgrade that transforms a diagnostic system into an execution engine. The difference between "what should we do?" and "why isn't it happening and how do we fix that?"`,
    ex:'Strata Stone: recommended action is "proceed with Nakawa shell phase." Feasibility check: subcontractor payment 6 weeks overdue (K), two foremen quit (L). Feasibility: 0.31. Action: clear arrears in 48h, hire replacement foremen.'
  },
  system:{
    color:'#854F0B',tags:['scale 3','hospital','infrastructure','capacity'],
    title:'System capacity — the institutional layer',
    sub:'What the institution can actually do right now, not what it is designed to do.',
    body:`Scale 3 is where individual need meets institutional supply. In clinical terms: ICU beds, ventilators, surgical suites, specialist availability. In real estate: crane capacity, cement supply chain, licensed subcontractor pool.\n\nSystem capacity is distinct from kin-network feasibility. The kin network asks: can this person reach the system? System capacity asks: when they arrive, does the system have what they need?\n\nThe capacity signal feeds the constraint check as an X (Logistics) input: if the system is at 100% ICU occupancy, the recommended scalar must change even if the individual eigenmode points to ICU admission.\n\nThe digital twin tracks system capacity as a real-time vector — not a static number, but a dynamic state that changes hour by hour. Bed allocation, staff deployment, supply chain delays all update the capacity signal continuously.\n\nDesign rule: the capacity signal must update faster than the triage clock for each timescale. For Existential timescales: minutes. For Strategic: weekly is sufficient.`,
    ex:'During the 2021 COVID surge, Mulago had the clinical knowledge to ventilate patients but ran out of oxygen. The eigenmode was correct. The X constraint (oxygen logistics) failed. System capacity was the binding blocker — not clinical knowledge.'
  },
  vector:{
    color:'#854F0B',tags:['math layer','V','gradient','∇L','drift','Ritual'],
    title:'V — Vector: gradient and drift  ·  Ritual timescale',
    sub:'Not just where the state is — which direction it is moving and how fast. Updated periodically, not continuously.',
    body:`The Vector layer is paired with the Ritual timescale because updating latent representations — checking whether your memory of the system still matches reality — is a periodic maintenance task, not a continuous one and not an emergency response.\n\nThe vector stores the compressed state of the system in the latent space. The gradient ∇L tells you direction and velocity of change. A patient whose vitals are bad but stable is different from one whose vitals are bad and deteriorating fast. The vector captures both position (where the state is) and velocity (where it is going).\n\nRitual/Vector pairing means: you revisit the latent representation on a schedule — wound dressing checks, weekly financial reconciliation, site inspections. Not reactive like Tactical/Scalar. Not slow like Strategic/Matrix. A maintenance loop that prevents drift.\n\nFailing the ritual loop means the system drifts. A patient who misses three wound dressings develops infection. A construction site that skips weekly reconciliation accumulates invisible leakage. The twin flags when a ritual has been missed and computes accumulated drift.`,
    ex:'In v07, the Vector layer is the "Gradient" column on the dashboard. A site with rising leakage trend gets flagged even if its absolute KPI is still acceptable — the velocity signal predicts the future state. That is the Ritual/Vector update at work.'
  },
  ritual:{
    color:'#854F0B',tags:['triage clock','Vector','days–weeks','maintenance','drift check'],
    title:'Ritual — the Vector timescale  ·  Days to weeks',
    sub:'Periodic pipeline that updates latent representations and prevents drift.',
    body:`Rituals are scheduled loops that maintain system health: wound dressing changes, medication cycles, site inspections, weekly financial reconciliation, agricultural planting seasons. They operate on a days-to-weeks timescale.\n\nMathematically, this is where vector updates happen in the latent space. The system periodically re-reads its state, compares it to the target vector, and applies small corrections. Not reactive like Tactical — preventive.\n\nThe Ritual/Vector pairing is precise: you are not recalibrating the global weight matrix W (that is Strategic/Matrix). You are updating the specific memory vectors that represent the current state of the world. Small, frequent, low-cost updates — versus the large, slow, expensive W recalibration that happens at the Strategic level.\n\nThe digital twin's job at this timescale: ensure the loop actually runs. Flag when a ritual has been missed. Compute accumulated drift. In the Strata Stone twin, the weekly subcontractor payment cycle is a ritual — when it breaks, the labor health vector drifts within 2–3 missed cycles.`,
    ex:'The weekly subcontractor payment cycle in Strata Stone is a ritual. When it breaks, the labor health vector drifts noticeably within 2 missed cycles. The twin should detect this at week 2, not week 6 when workers have already left the site.'
  },
  capsignal:{
    color:'#854F0B',tags:['deployment signal','real-time readiness','system constraint'],
    title:'Capacity signal — real-time institutional readiness',
    sub:'What is actually available right now, not what the plan says should be available.',
    body:`The capacity signal is not a plan — it is a live reading of what the institution can execute right now. It aggregates: available beds and staff (L), procurement lead times (X), financial headroom (K), and regulatory clearances (G).\n\nThis signal modifies the recommended scalar in real time. If the capacity signal drops below a threshold, the system must either find an alternative action or escalate to the next scale (national policy) to unlock additional capacity.\n\nIn the Strata Stone twin, the capacity signal drives the "At Risk" count on the portfolio dashboard. A site with declining capacity across multiple vectors triggers an automated intervention recommendation.\n\nKey design question: which variables need Operational (continuous) tracking vs Ritual (weekly) vs Strategic (quarterly)? Putting everything on Operational is wasteful. The triage engine makes this classification automatically based on rate of change and eigenmode weight.`,
    ex:"A hospital's capacity signal at 3am on a public holiday: ICU at 94%, two intensivists on call, blood bank running low on O-negative. This signal should automatically re-route new critical admissions before the constraint becomes a crisis."
  },
  national:{
    color:'#534AB7',tags:['scale 4','NPA','policy','resource allocation'],
    title:'National scorecard — the policy layer',
    sub:'Where individual needs aggregate into resource allocation decisions.',
    body:`Scale 4 is where the system scales from institutions to nation-states. The National Planning Authority, Ministry of Health, Ministry of Finance — these actors set the weights W of the system at population level.\n\nThe national scorecard answers: across all individual twins, all kin networks, all hospital systems — where is the system losing? What is the dominant eigenmode at population scale? Where should capital flow?\n\nThis is the Civilizational Scorecard applied domestically. It is also where KER (Knowledge, Economy, Rights) lives — the sociopolitical determinants that set structural constraints for every lower-level intervention.\n\nThe digital twin at this scale is a governance tool, not a clinical tool. It tells policymakers which interventions have the highest η (efficiency = M·V/C) at population scale. The proof-of-gradient test: show that a policy change at scale 4 measurably shifts outcomes at scale 1.`,
    ex:"Uganda's national maternal mortality rate is not primarily a clinical failure. It is a scale-4 failure: insufficient trained midwives (L), weak referral protocols (G), inadequate road infrastructure for emergency transport (X). The national scorecard surfaces this distribution."
  },
  eigenmode:{
    color:'#534AB7',tags:['math layer','E','eigenvalue','dominant pattern','Existential','ER','crisis'],
    title:'E — Eigenmode: dominant invariant  ·  Existential / ER timescale  ⚡',
    sub:'The moment of maximum compression. By the time λ₁ dominates, you have an hour — often less.',
    body:`The alignment of Eigenmode with Existential/ER is the architectural insight that the v10 revision makes explicit.\n\nAn eigenmode is the natural resonance of the system — the principal component that explains the most variance. Extracting it requires that you have already run through Tensor (raw reality), Matrix (compression), and Vector (latent representation). Only then can you identify: what single structural fact explains this crisis?\n\nHere is the inversion: each prior step (T→M→V) was progressively less urgent — more patient, more architectural, more strategic. But the moment you extract the dominant eigenmode, the clock has flipped. You now have an hour, or minutes. The compression IS the urgency.\n\n"This is septic shock" is not a diagnosis — it is an eigenmode. "The cement procurement is the systemic leakage driver" is an eigenmode. Both demand immediate scalar deployment. Both emerged from patient, slow, multi-layer processing — but the output is a crisis clock.\n\nIn the v07 Strata Stone analysis: cement (0.487) + steel (0.312) = eigenmode breach. One number changed the entire management strategy.`,
    ex:'In the ER: a patient arrives unconscious, hypotensive, tachycardic, diaphoretic. The T→M→V pipeline runs in seconds (gestalt, vitals, lactate). The eigenmode output: haemorrhagic shock. Time remaining: minutes. Scalar: 2 large-bore IVs, type-and-cross, activate massive transfusion protocol. Now.'
  },
  strategic:{
    color:'#0F6E56',tags:['triage clock','Matrix','months–years','weight recalibration','W'],
    title:'Strategic — the Matrix timescale  ·  Months to years',
    sub:'Where you change the weights W globally. Not reaction — restructuring.',
    body:`The Strategic timescale operates over months to years and is paired with the Matrix layer because both involve global recalibration of the compression architecture — not responding to the current state, but redesigning how the system will process future states.\n\nIn clinical terms: changing training curricula, building new infrastructure, shifting community health worker deployment. In real estate: renegotiating supplier contracts, redesigning procurement systems, changing site management protocols.\n\nThe Strategic/Matrix pairing has a sharp implication: you cannot fix a Matrix problem at a Tactical timescale. If the weight matrix W is systematically miscalibrated — ignoring social determinants, over-weighting visible symptoms, blind to gender or logistics constraints — that cannot be corrected in real time. The fix requires a Strategic-level intervention that predates the crisis.\n\nThe digital twin at this timescale must simulate counterfactuals — "if we implement this strategic change, what does the loss curve look like in 18 months?" — to justify the investment cost. Strategic interventions are slow; the twin makes the delay legible.`,
    ex:"Strata Stone's policy requiring all payments through bank/mobile money (avoiding cash) is a Strategic/Matrix intervention. It recalibrates the Governance weight G globally across all sites — reduces leakage risk at the source rather than detecting it after the fact."
  },
  budget:{
    color:'#534AB7',tags:['K constraint','capital','NPA','treasury','disbursement'],
    title:'Budget release — K constraint at national scale',
    sub:'The most common reason correct decisions do not execute at institutional scale.',
    body:`Budget release is the national-scale manifestation of the K (Capital) constraint. The recommended action is known. The implementing institution is ready. The capital has not been released.\n\nThis is not a failure of intelligence — it is a failure of governance and treasury mechanics. In Uganda, the NPA approves development projects but disbursement happens through the Ministry of Finance via Treasury Single Account. The gap between approval and disbursement is often 6–18 months — long enough to kill project velocity entirely.\n\nThe v10 architecture treats budget release as a specific signal in the K constraint layer that needs its own monitoring loop, separate from clinical or construction constraints.\n\nThe twin tracks: commitment date, expected disbursement date, actual disbursement date, and the accumulated velocity loss from the gap. That gap is the hidden cost that most national planning systems do not compute.`,
    ex:'A new district hospital is approved by NPA. Design complete. Site cleared. But the supplementary budget has not been released by Finance. The project sits idle for 8 months. K constraint is the binding blocker — everything else is ready.'
  },
  civilizational:{
    color:'#993C1D',tags:['scale 5','economy','energy','epistemology','generational'],
    title:'Civilizational — the longest timescale',
    sub:'Economy, energy systems, and what a society collectively believes to be possible.',
    body:`Scale 5 is the civilizational layer: the structural conditions that set the possibility space for everything below. Three variables dominate: economy (how resources flow), energy (the physical infrastructure of production), and epistemology (what is collectively believed to be true and achievable).\n\nEpistemology is the most underrated constraint. A society that believes maternal death during childbirth is inevitable will not build the referral systems that prevent it. A construction company that believes material leakage is "just how things work here" will not invest in reconciliation systems. The digital twin must eventually model epistemic constraints — not just physical and financial ones.\n\nThis layer moves on generational timescales. It cannot be changed by a single intervention. But it can be shifted incrementally by consistent, high-η interventions at scales 1–4 that produce visible, documented outcomes.\n\nUkubona LLC's long thesis: if you can build a civilizational scorecard that makes these slow variables legible, you can accelerate the feedback loop and compress the generational timescale.`,
    ex:'The shift from cash to mobile-money payments in Uganda (MTN MoMo) was a civilizational-scale change in financial epistemology. It made the K constraint auditable for the first time. That single shift enabled the entire digital twin financial tracking layer.'
  },
  scalar:{
    color:'#993C1D',tags:['math layer','S','decision','action','Tactical','t → 0'],
    title:'S — Scalar: the final output  ·  Tactical timescale',
    sub:'Maximum dimensionality reduction. The pipeline is complete. Deploy.',
    body:`The Scalar is paired with the Tactical timescale because they share the same property: irreducibility. The Scalar is the most compressed representation possible — one number, one binary, one action. Tactical is the most compressed time window possible — t→0.\n\nThe inversion principle in full: Tensor/Operational is the widest, most patient layer. Scalar/Tactical is the narrowest, most urgent. Every intermediate layer compressed both dimensions simultaneously — stripping variables while shortening the time to act.\n\nThis is why you cannot shortcut from Tensor to Scalar. Each compression step (M→V→E) is not bureaucratic overhead — it is the mechanism that generates the urgency. If you skip straight to Scalar without extracting the eigenmode, you are deploying an action without knowing what crisis you are responding to. Pattern-matching without structural understanding.\n\nThe scalar is not the end of the pipeline — it is the beginning of the next loop. When it meets reality, it generates a loss L. That loss propagates backward as ∇L, updating the eigenmode, the memory vectors, and the emotion weights so the next tensor is processed more accurately.`,
    ex:'The Strata Stone dashboard composite KPI (0–100) is the scalar. It collapses 120 variables across 20 sites into one number: above 70 = steady state, 45–70 = watch list, below 45 = intervention required. That number took a full T→M→V→E pipeline to produce. The Tactical response (which site manager to call, today) follows automatically.'
  },
  eta:{
    color:'#993C1D',tags:['efficiency','η','M·V/C','universal metric','optimisation'],
    title:'η = M · V / C — the universal efficiency function',
    sub:'The formula that ranks every possible intervention across every timescale.',
    body:`η is the Return on Restoration. It allows the system to rank every possible intervention across every timescale and every scale with a single number.\n\nM = Magnitude: how much improvement does the action produce?\nV = Velocity: how fast? In high-velocity regimes (Existential/ER), V often matters more than M.\nC = Cost: total energy or resource expenditure — biological, financial, computational.\n\nA system is "locked in" when Cost exceeds Magnitude × Velocity. That is when the twin triggers a gradient descent update to reroute the intervention.\n\nCritical insight: most healthcare and construction systems optimise M (effectiveness) OR C (cost). Almost none optimise V (speed) explicitly. But in high-velocity regimes, a slow correct decision is worse than a fast imperfect one. η makes this trade-off computable.\n\nη* = argmax η subject to kin-network and constraint bounds. The star denotes the feasibility-constrained optimum — not the best action in theory, but the best action that can actually execute given the current social and institutional configuration.`,
    ex:'Early antibiotics in sepsis: M = moderate, V = very high (must act within 1h), C = low (generics are cheap). η is high. Waiting for culture results: M = higher (targeted therapy), V = very low (48h wait), C = same. η is low. The formula says: give empirical antibiotics now.'
  },
  backprop:{
    color:'#5F5E5A',tags:['∇L','backpropagation','learning loop','gradient descent'],
    title:'∇L — the learning loop',
    sub:'When the scalar meets reality, the error propagates backward through every layer.',
    body:`The dashed loop is the most important line in the architecture. It is what makes this a learning system rather than a static diagnostic tool.\n\nWhen scalar s is deployed and meets reality, it generates an outcome. The difference between expected and actual outcome is the loss L. The gradient ∇L = (∂L/∂s)·(∂s/∂λ)·(∂λ/∂v)·(∂v/∂W) propagates backward:\n\n— Updates the eigenmode (E): was the dominant pattern correctly identified?\n— Updates the memory vectors (V): was the latent representation accurate?\n— Updates the emotion weights (M): were the right signals amplified?\n— Updates tensor ingestion (T): are the right variables being collected?\n\nGradient depth must respect timescale. Tactical: only emotion heuristics W update. Existential: dominant eigenmode updates. Ritual: memory vectors update. Strategic: W updates globally. Operational: tensor ingestion itself recalibrates.\n\nWithout this loop, the system is a dashboard. With it, the system is a learning agent that improves every time an action is taken.`,
    ex:"A hospital implements the twin's recommendation to fast-track sepsis patients. Mortality drops 12% in month 1. That 12% improvement is the ∇L signal — it propagates backward and increases the weight of 'lactate > 2.0' and 'HR > 110' in the triage matrix W."
  },
  labor:{
    color:'#A32D2D',tags:['constraint','L','human resources','availability'],
    title:'L — Labor constraint',
    sub:'The required human is not available.',
    body:`The Labor constraint is the most immediate deployment blocker. A correct recommendation cannot execute if the person who must perform it is absent.\n\nL constraints appear at every scale:\nScale 1: no surgeon on call, no midwife in the facility\nScale 2 (Kin): no family member to accompany, no one to give consent\nScale 3 (System): nursing staff below safe ratio, specialist waitlist 6 months\nScale 4 (National): chronic healthcare worker brain drain, teacher shortage\nScale 5 (Civilizational): entire generation of engineers not trained\n\nThe constraint attribution layer tracks L as a weighted float per variable. A variable with high L-weight means that even if M, V, and C are favourable, the action cannot execute without resolving the labor bottleneck first.\n\nIntervention for L constraints: pre-position human capacity before the crisis. Training pipelines, retention incentives, task-shifting protocols, and on-call rosters are all L-constraint mitigations.`,
    ex:'Fort Portal Regional Referral Hospital has one general surgeon. When that surgeon is on leave, no emergency laparotomy is possible. L constraint on abdominal emergencies goes to 1.0. The twin should flag this during the leave period and re-route referrals proactively — before the crisis, not after.'
  },
  governance:{
    color:'#534AB7',tags:['constraint','G','consent','authority','regulation'],
    title:'G — Governance constraint',
    sub:'Authority or consent is not in place.',
    body:`Governance constraints are the most culturally specific and the hardest to model — but they are among the most common deployment blockers in African clinical and institutional contexts.\n\nG constraints include:\nClinical: patient cannot consent (unconscious, minor, incapacitated)\nCultural: decision-maker under local custom not present (spouse, elder, clan head)\nInstitutional: required approvals not obtained (procurement committee, board)\nRegulatory: license or certification missing or expired\nPolitical: ministry has not authorised release of funds or personnel\n\nIn Strata Stone, G constraints appear as "unapproved vendors" (procurement governance) and "payment without board approval" (financial governance). Both generate leakage that is not random but systemic — it compounds over time.\n\nG constraints are often invisible to clinical and technical systems that assume the authority structure is already in place. The kin-network layer is specifically designed to make G constraints legible before they block deployment.`,
    ex:'A woman in obstructed labour needs emergency C-section. Surgeon available (L ok). Theatre available (X ok). NHIS covers it (K ok). But local custom requires husband consent and he is 4 hours away. G = 0. Escalation pathway: call the LC1 chairman as legal proxy.'
  },
  capital:{
    color:'#854F0B',tags:['constraint','K','finance','payment','credit'],
    title:'K — Capital constraint',
    sub:'The money is not available, not accessible, or not in the right form.',
    body:`Capital constraints are the most legible to administrators and the most politically sensitive. They manifest as:\n— Out-of-pocket payments the patient cannot make\n— Insurance claims not processed or rejected\n— Supplier invoices overdue causing supply stoppage\n— Budget lines exhausted or not released from Treasury\n— Credit facilities maxed out or requiring unavailable collateral\n\nIn Strata Stone, K constraints cascade: subcontractor payment lag → labour departure → remobilisation cost → project delay → client penalty. The original K constraint compounds through every downstream link.\n\nThe key metric is not just "is there money?" but "is the money accessible in the right form, at the right time, through the right channel?" Cash in a Kampala account does not solve a payment crisis for a subcontractor in Gulu who needs mobile money today.\n\nIntervention: pre-trigger payment protocols before the lag accumulates. Maintain a rolling float for operational continuity. Pre-approve credit lines before they are needed.`,
    ex:'The Strata Stone action engine output for a K constraint: "Subcontractor Payment Lag rising. Capital constraint. Action: clear arrears within 48h via MTN MoMo. If float insufficient, trigger pre-approved credit line with Centenary Bank (72h disbursement)."'
  },
  logistics:{
    color:'#0F6E56',tags:['constraint','X','transport','supply chain','last mile'],
    title:'X — Logistics constraint',
    sub:'The thing or person cannot physically move.',
    body:`Logistics constraints are last-mile failures that make everything else irrelevant. The diagnosis is correct, the consent is obtained, the money is available — but the patient cannot reach the hospital, or the cement cannot reach the site.\n\nX constraints in clinical settings:\n— No ambulance or transport available\n— Road impassable (rain, flooding, conflict)\n— Distance exceeds the time window for the intervention\n— Cold chain broken (vaccine, blood, medication spoilage)\n— Referral network not functioning (phones down, facility closed)\n\nX constraints in construction:\n— Cement delivery delayed 3 weeks\n— Crane breakdown at critical phase\n— Fuel shortage preventing site operations\n— Road conditions preventing heavy truck access\n\nThe Strata Stone geo-map (9 trucks tracked across East Africa in v07) is specifically designed to surface X constraints in real time. X constraints interact with K constraints — a logistics delay generates a capital cost (idle labour, contract penalties) not in the original budget.`,
    ex:'Juba City View (s17): supply delay 18 days, weather risk 0.78, labor index 0.42. All three are X or X-adjacent constraints. The twin flags this as highest-risk in the portfolio — not because of management failure but because the physical operating environment makes every action expensive and slow.'
  }
};

function show(key) {
  const n = N[key];
  if (!n) return;
  document.getElementById('bar').style.background = n.color;
  document.getElementById('title').textContent = n.title;
  document.getElementById('subtitle').textContent = n.sub;
  const tagsEl = document.getElementById('tags');
  tagsEl.innerHTML = '';
  n.tags.forEach(t => {
    const s = document.createElement('span');
    s.className = 'tag';
    s.textContent = t;
    tagsEl.appendChild(s);
  });
  const bodyEl = document.getElementById('body');
  bodyEl.innerHTML = '';
  n.body.split('\n\n').forEach(para => {
    const p = document.createElement('p');
    p.textContent = para;
    bodyEl.appendChild(p);
  });
  const exBox = document.getElementById('ex');
  const exText = document.getElementById('ex-text');
  if (n.ex) {
    exBox.style.display = 'block';
    exBox.style.borderLeftColor = n.color;
    exText.textContent = n.ex;
  } else {
    exBox.style.display = 'none';
  }
  document.getElementById('overlay').classList.add('open');
}

function close() {
  document.getElementById('overlay').classList.remove('open');
}

function closeIfBg(e) {
  if (e.target === document.getElementById('overlay')) close();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
</script>

</html>
